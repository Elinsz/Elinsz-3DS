<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro de Clientes</title>
  <link rel="stylesheet" href="./assets/stylesheet/reset.css" />
  <link rel="stylesheet" href="./assets/stylesheet/style.css" />
  <script type="text/javascript" src="./assets/javascript/script.js" defer></script>
</head>
<body>
  <!-- Cabeçalho principal -->
  <div id="nav">
    Cadastro de Clientes
  </div>

  <!-- Navegação secundária com abas -->
  <nav id="sub-nav">
    <ul class="tab-menu">
      <li><a href="#" class="tab-link active" data-tab="form-tab">Cadastro</a></li>
      <li><a href="#" class="tab-link" data-tab="table-tab">Registros</a></li>
    </ul>
  </nav>

  <!-- Conteúdo das abas -->
  <section id="tabs">
    <!-- Aba de cadastro -->
    <div id="form-tab" class="tab-content active">
      <form method="POST">
        <div id="input-data">
          <div class="input-group">
            <!-- Linha 1 -->
            <div class="form-field">
              <label for="codigo">Código</label>
              <input id="codigo" class="input-text" type="text" required />
            </div>
            <div class="form-field">
              <label for="data">Data Registro</label>
              <input id="data" class="input-text" type="date" required />
            </div>

            <!-- Linha 2 -->
            <div class="form-field">
              <label for="nome">Nome</label>
              <input id="nome" class="input-text" type="text" required />
            </div>
            <div class="form-field">
              <label for="cpf">CPF/CNPJ</label>
              <input id="cpf" class="input-text" type="text" required />
            </div>

            <!-- Linha 3 -->
            <div class="form-field">
              <label for="endereco">Endereço</label>
              <input id="endereco" class="input-text" type="text" required />
            </div>
            <div class="form-field">
              <label for="bairro">Bairro</label>
              <input id="bairro" class="input-text" type="text" required />
            </div>

            <!-- Linha 4 -->
            <div class="form-field">
              <label for="cidade">Cidade</label>
              <input id="cidade" class="input-text" type="text" required />
            </div>
            <div class="form-field">
              <label for="uf">UF</label>
              <input id="uf" class="input-text" type="text" required />
            </div>

            <!-- Linha 5 -->
            <div class="form-field">
              <label for="cep">CEP</label>
              <input id="cep" class="input-text" type="text" required />
            </div>
            <div class="form-field">
              <label for="email">Email</label>
              <input id="email" class="input-text" type="email" required />
            </div>

            <!-- Linha 6 -->
            <div class="form-field">
              <label for="fone1">Celular</label>
              <input id="fone1" class="input-text" type="text" required />
            </div>
            <div class="form-field">
              <label for="fone2">Fone</label>
              <input id="fone2" class="input-text" type="text" />
            </div>
          </div>

          <!-- Botões -->
          <input id="add-btn" class="input-btn" type="submit" value="Cadastrar" onclick="return addToTable()" />
          <input id="update-btn" class="input-btn" type="button" value="Atualizar" onclick="return updateTable()" style="display: none;" />
        </div>
      </form>
    </div>

    <!-- Aba de registros -->
    <div id="table-tab" class="tab-content">
      <div class="table-wrapper">
        <table id="myTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Código</th>
              <th>Data</th>
              <th>Nome</th>
              <th>CPF/CNPJ</th>
              <th>Endereço</th>
              <th>Bairro</th>
              <th>Cidade</th>
              <th>UF</th>
              <th>CEP</th>
              <th>Email</th>
              <th>Celular</th>
              <th>Fone</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody>
            <!-- Linhas serão adicionadas aqui -->
          </tbody>
        </table>
      </div>
    </div>
  </section>
</body>
</html>
