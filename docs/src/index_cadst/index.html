<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro de Clientes</title>
  <link rel="stylesheet" href="./assets/stylesheet/reset.css" />
  <link rel="stylesheet" href="./assets/stylesheet/style.css" />
  <script type="text/javascript" src="./assets/javascript/script.js" defer></script>
</head>

  <body>
    <div id="nav">Sistema de Cadastro</div>

    <div id="sub-nav">
      <ul class="tab-menu">
        <li><a href="#" class="tab-link active" data-tab="form-tab">Cadastro</a></li>
        <li><a href="#" class="tab-link" data-tab="table-tab">Registros</a></li>
      </ul>
    </div>

    <div id="tabs">
      <div id="form-tab" class="tab-content active">
        <div id="input-data">
          <div class="input-group">
            <!-- Campos do formulário -->
            <div class="form-field"><label for="codigo">Código</label><input id="codigo" class="input-text" /></div>
            <div class="form-field"><label for="data">Data</label><input id="data" class="input-text" type="date" /></div>
            <div class="form-field"><label for="nome">Nome</label><input id="nome" class="input-text" /></div>
            <div class="form-field"><label for="cpf">CPF/CNPJ</label><input id="cpf" class="input-text" /></div>
            <div class="form-field"><label for="endereco">Endereço</label><input id="endereco" class="input-text" /></div>
            <div class="form-field"><label for="bairro">Bairro</label><input id="bairro" class="input-text" /></div>
            <div class="form-field"><label for="cidade">Cidade</label><input id="cidade" class="input-text" /></div>
            <div class="form-field"><label for="uf">UF</label><input id="uf" class="input-text" /></div>
            <div class="form-field"><label for="cep">CEP</label><input id="cep" class="input-text" /></div>
            <div class="form-field"><label for="email">Email</label><input id="email" class="input-text" /></div>
            <div class="form-field"><label for="fone1">Fone 1</label><input id="fone1" class="input-text" /></div>
            <div class="form-field"><label for="fone2">Fone 2</label><input id="fone2" class="input-text" /></div>
          </div>
          <div class="button-group">
            <button id="add-btn" class="input-btn" onclick="addToTable()">Cadastrar</button>
            <button id="update-btn" class="input-btn" onclick="updateTable()" style="display:none;">Atualizar</button>
          </div>
        </div>
      </div>

      <div id="table-tab" class="tab-content">
        <div class="table-wrapper">
          <table id="myTable">
            <thead>
              <tr>
                <th>ID</th><th>Código</th><th>Data</th><th>Nome</th><th>CPF/CNPJ</th><th>Endereço</th><th>Bairro</th>
                <th>Cidade</th><th>UF</th><th>CEP</th><th>Email</th><th>Fone 1</th><th>Fone 2</th><th>Ação</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </body>

</html>
