<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro de Clientes</title>
  <link rel="stylesheet" href="./assets/stylesheet/reset.css" />
  <link rel="stylesheet" href="./assets/stylesheet/style.css" />
  <script type="text/javascript" src="./assets/javascript/script.js" defer></script>
</head>
<body>
  <!-- Cabeçalho principal -->
  <div id="nav">
    Cadastro de Clientes
  </div>

  <!-- Navegação secundária com abas -->
  <nav id="sub-nav">
    <ul class="tab-menu">
      <li><a href="#" class="tab-link active" onclick="showTab('form-tab')">Cadastro</a></li>
      <li><a href="#" class="tab-link" onclick="showTab('table-tab')">Registros</a></li>
    </ul>
  </nav>

  <!-- Conteúdo das abas -->
  <section id="tabs">
    <!-- Aba de cadastro -->
    <div id="form-tab" class="tab-content active">
      <form method="POST">
        <div id="input-data">
          <div class="input-group">
            <!-- Linha 1 -->
            <input id="codigo" class="input-text" placeholder="Código" type="text" required />
            <input id="data" class="input-text" placeholder="Data Registro" type="date" required />

            <!-- Linha 2 -->
            <input id="nome" class="input-text" placeholder="Nome" type="text" required />
            <input id="cpf" class="input-text" placeholder="CPF/CNPJ" type="text" required />

            <!-- Linha 3 -->
            <input id="endereco" class="input-text" placeholder="Endereço" type="text" required />
            <input id="bairro" class="input-text" placeholder="Bairro" type="text" required />

            <!-- Linha 4 -->
            <input id="cidade" class="input-text" placeholder="Cidade" type="text" required />
            <input id="uf" class="input-text" placeholder="UF" type="text" required />

            <!-- Linha 5 -->
            <input id="cep" class="input-text" placeholder="CEP" type="text" required />
            <input id="email" class="input-text" placeholder="Email" type="email" required />

            <!-- Linha 6 -->
            <input id="fone1" class="input-text" placeholder="Fone 1" type="text" required />
            <input id="fone2" class="input-text" placeholder="Fone 2" type="text" />
          </div>

          <!-- Botões -->
          <input id="add-btn" class="input-btn" type="submit" value="Cadastrar" onclick="return addToTable()" />
          <input id="update-btn" class="input-btn" type="button" value="Atualizar" onclick="return updateTable()" style="display: none;" />
        </div>
      </form>
    </div>

    <!-- Aba de registros -->
    <div id="table-tab" class="tab-content">
      <div class="tab-inner">
        <table id="myTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Código</th>
              <th>Data</th>
              <th>Nome</th>
              <th>CPF/CNPJ</th>
              <th>Endereço</th>
              <th>Bairro</th>
              <th>Cidade</th>
              <th>UF</th>
              <th>CEP</th>
              <th>Email</th>
              <th>Fone 1</th>
              <th>Fone 2</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody>
            <!-- Linhas serão adicionadas aqui -->
          </tbody>
        </table>
      </div>
    </div>
  </section>
</body>
</html>
