<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro</title>
  <link rel="stylesheet" href="assets/stylesheet/style-form.css" />
  <script src=assets/javascript/script-form.js" defer></script>

</head>
<body>
  <header>
    <main>
      <nav>
        <div class="side-bar logo-details active">
            <div class="nav-links">
              <div id="nav">Sistema de Cadastro</div>
              <div id="sub-nav">
                <div class="tab-menu">
                  <div><a class="tab-link active" href="../index_cadst/index-form.html" target="conteudo">Cadastro</a></div>
                  <div><a class="tab-link" href="../index_cadst/index-regist.html" target="conteudo">Registros</a></div>
                </div>
              </div>
            </div>

              <div id="form-tab">
                <div id="input-data">
                  <div class="input-group">
                    <div class="col-esquerda">
                      <div class="form-field"><label for="codigo">Código</label><input id="codigo" class="input-text input-sm" maxlength="10" /></div>
                      <div class="form-field"><label for="nome">Nome</label><input id="nome" class="input-text input-xl" maxlength="40" /></div>
                      <div class="form-field"><label for="email">Email</label><input id="email" class="input-text input-xl" maxlength="50" /></div>
                      <div class="form-field"><label for="cpf">CPF/CNPJ</label><input id="cpf" placeholder="000.000.000-00" class="input-text input-md" maxlength="18" /></div>
                      <div class="form-field"><label for="celular">Celular</label><input id="celular" placeholder="(00)99999-9999" class="input-text input-md" maxlength="15" /></div>
                      <div class="form-field"><label for="fone">Telefone Fixo</label><input id="fone" placeholder="(00)9999-9999" class="input-text input-md" maxlength="14" /></div>
                    </div>

                    <div class="col-direita">
                      <div class="form-field date-field">
                        <label for="data">Data</label>
                        <div class="input-icon">
                          <input id="data" class="input-text" placeholder="dd/mm/aaaa" class="input-text input-sm" maxlength="10" />
                          <span class="calendar-btn" onclick="abrirCalendario('data')">📅</span>
                        </div>
                      </div>
                      <div class="form-field"><label for="endereco">Endereço</label><input id="endereco" class="input-text input-xxl" maxlength="60"/></div>
                      <div class="form-field"><label for="bairro">Bairro</label><input id="bairro" class="input-text input-lg" maxlength="30"/></div>
                      <div class="form-field"><label for="cep">CEP</label><input id="cep" class="input-text input-sm" maxlength="9"/></div>
                      <div class="form-field"><label for="cidade">Cidade</label><input id="cidade" class="input-text input-lg" maxlength="30"/></div>
                      <div class="form-field"><label for="uf">UF</label><input id="uf" class="input-text input-xs" maxlength="2"/></div>
                    </div>
                  </div>

                  <div class="button-row">
                    <button id="add-btn" class="input-btn active-btn">Cadastrar</button>
                    <button id="update-btn" class="input-btn">Atualizar</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </main>
  </header>
</body>
</html>
