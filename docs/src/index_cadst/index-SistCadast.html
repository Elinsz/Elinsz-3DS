<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Sistema de Cadastro</title>
  <link rel="stylesheet" href="assets/stylesheet/style-sistcadast.css" />
  <!-- <script src="assets/javascript/script-sistcadast.js" defer></script> -->
</head>
<body>
  <div id="nav">Sistema de Cadastro</div>

  <div id="sub-nav">
    <ul class="tab-menu">
      <!-- <li><button class="tab-link active" data-page="form">Cadastro</button></li>
      <li><button class="tab-link" data-page="regist">Registros</button></li> -->

      <li><button class="tab-link active" href="../index_cadst/index-form.html" target="conteudo">Cadastro</button></li>
      <li><button class="tab-link"  href="../index_cadst/index-regist.html" target="conteudo">Registros</button></li>
    </ul>
  </div>

  <section>
    <iframe id="content-frame" frameborder="0" width="100%" height="600px" src="../../abertura.html" name="conteudo"></iframe>
  </section>


  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const links = document.querySelectorAll('.tab-link');
      const iframe = document.getElementById('content-frame');

      // Restaura aba ativa do localStorage
      const lastHref = localStorage.getItem('abaAtiva');
      if (lastHref) {
        const lastLink = Array.from(links).find(link => link.getAttribute('href') === lastHref);
        if (lastLink) {
          links.forEach(l => l.classList.remove('active'));
          lastLink.classList.add('active');
          iframe.setAttribute('src', lastHref);
        }
      }

      // Evento de clique nas abas
      links.forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();

          // Atualiza visual
          links.forEach(l => l.classList.remove('active'));
          link.classList.add('active');

          // Atualiza iframe
          const href = link.getAttribute('href');
          iframe.setAttribute('src', href);

          // Salva aba ativa
          localStorage.setItem('abaAtiva', href);
        });
      });

      // Ajusta altura do iframe dinamicamente (se permitido)
      iframe.addEventListener('load', () => {
        try {
          const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
          const altura = iframeDoc.body.scrollHeight;
          iframe.style.height = altura + 'px';
        } catch (err) {
          console.warn('Não foi possível ajustar a altura do iframe:', err);
        }
      });
    });


  </script>
</body>

</html>
