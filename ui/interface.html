<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elinsz 3DS</title>

    <!-- Biblioteca Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Estilo personalizado -->
    <link rel="stylesheet" href="../css/interface.css">

</head>
<body>
    <div id="canvas-container"></div>

    <div id="library-panel">
        <div class="menu">
            <button class="dropdown-btn">Biblioteca de Componentes ▾</button>
            <div class="dropdown-content">
                <button onclick="loadComponent('Componente 1')">Componente 1</button>
                <button onclick="loadComponent('Componente 2')">Componente 2</button>
                <button onclick="loadComponent('Componente 3')">Componente 3</button>
            </div>
        </div>

        <div class="menu">
            <button class="dropdown-btn">Componentes de Testes Salvos ▾</button>
            <div class="dropdown-content" id="saved-components">
                <p>Nenhum componente salvo.</p>
            </div>
        </div>
    </div>

    <div id="control-panel">
        <div class="menu">
            <button class="dropdown-btn">Ações ▾</button>
            <div class="dropdown-content">
                <button onclick="addModule()">Adicionar Módulo</button>
                <button onclick="saveModules()">Salvar</button>
                <button onclick="loadModules()">Carregar</button>
            </div>
        </div>
    </div>

    <!-- Script principal -->
    <script src="../js/interface.js"></script>
</body>
</html>
