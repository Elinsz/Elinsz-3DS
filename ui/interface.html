<h2>Cadastrar Novo Acabamento</h2>
<form id="form-acabamento">
  <input type="text" id="nome-acabamento" placeholder="Nome do acabamento" required>
  <input type="file" id="arquivo-textura" accept=".jpg,.png" required>
  <button type="submit">Cadastrar</button>
</form>

<h2>Cadastrar Novo Acessório</h2>
<form id="form-acessorio">
  <input type="text" id="nome-acessorio" placeholder="Nome do acessório" required>
  <input type="file" id="arquivo-modelo" accept=".skp" required>
  <button type="submit">Cadastrar</button>
</form>
